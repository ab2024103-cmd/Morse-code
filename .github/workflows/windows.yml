name: Build Windows MSI / EXE installer

on:
  push:
    branches: [main, arena/**]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        working-directory: pc-app
        run: npm install

      - name: Install Tauri CLI
        working-directory: pc-app
        run: npm install -D @tauri-apps/cli@^2

      - name: Build the Tauri app (MSI + NSIS exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: pc-app

      # The action above builds NSIS .exe + WiX .msi into
      # pc-app/src-tauri/target/release/bundle/nsis and /msi.
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: morselink-windows-installers
          path: |
            pc-app/src-tauri/target/release/bundle/nsis/*.exe
            pc-app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
