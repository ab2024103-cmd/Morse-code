// ============================================================================
// MorseLink CI diagnostics hook (applied from settings.gradle, guarded).
//
// Why this exists:
//  * the CI bot cannot touch .github/workflows/** (no `workflows` permission)
//    — so it cannot add log/summary/release steps;
//  * the Actions raw-log & artifact-blob endpoints are blocked from the agent
//    environment, but the Checks REST API (annotations) and api.github.com are
//    reachable — so build failures are mirrored into:
//      1. `::error::` workflow commands  -> check-run annotations,
//      2. $GITHUB_STEP_SUMMARY           -> job summary on the run page,
//      3. a forced push of diagnostics.md to arena/ci-diagnostics using the
//         credentials actions/checkout persisted (also proves whether the job
//         token can write at all — needed for publishing releases).
//
// NOTE: pluginManagement{} MUST be the first block in settings.gradle (only
// comments may precede it) — that is why all of this lives in a separately
// applied file. Keep syntax plain: a compile error here used to silently kill
// the whole build in ~4 s (apply is wrapped in try/catch in settings.gradle,
// so failures here are visible as an annotation instead).
// ============================================================================

def mlAppend = { String text ->
    try {
        def p = System.getenv("GITHUB_STEP_SUMMARY")
        if (p != null && p.length() > 0) {
            def f = new File(p)
            f << text
        }
    } catch (Throwable ignored) {
    }
}

def mlAnn = { String msg ->
    try {
        def s = msg.replace("\r", " ").replace("\n", " ").replace("::", "-")
        if (s.length() > 780) {
            s = s.substring(0, 780)
        }
        println("::error::" + s)
    } catch (Throwable ignored) {
    }
}

def mlChain = { Throwable fail ->
    def out = new StringBuilder()
    def t = fail
    for (int i = 0; i < 8 && t != null; i++) {
        String msg = String.valueOf(t.toString())
        if (msg.length() > 4800) {
            msg = msg.substring(0, 4800) + " ...[cut]"
        }
        out.append(i == 0 ? "FAILURE: " : "Caused by: ").append(msg).append("\n")
        try {
            def frames = t.getStackTrace()
            int shown = 0
            for (int j = 0; j < frames.length && shown < 4; j++) {
                String cn = frames[j].getClassName()
                if (!cn.startsWith("org.gradle.") && !cn.startsWith("java.") &&
                    !cn.startsWith("jdk.") && !cn.startsWith("groovy.") &&
                    !cn.startsWith("sun.") && !cn.startsWith("com.sun.")) {
                    out.append("    at ").append(frames[j].toString()).append("\n")
                    shown++
                }
            }
        } catch (Throwable ignored) {
        }
        t = t.getCause()
    }
    return out.toString()
}

def mlDaemonTail = { int maxLines ->
    def out = new StringBuilder()
    try {
        def base = new File(new File(System.getProperty("user.home"), ".gradle"), "daemon")
        def newest = null
        def subs = base.listFiles()
        if (subs != null) {
            for (def sub : subs) {
                def logs = sub.listFiles()
                if (logs == null) {
                    continue
                }
                for (def lf : logs) {
                    if (lf.getName().endsWith(".out.log")) {
                        if (newest == null || lf.lastModified() > newest.lastModified()) {
                            newest = lf
                        }
                    }
                }
            }
        }
        if (newest != null) {
            def lines = newest.readLines()
            int start = lines.size() - maxLines
            if (start < 0) {
                start = 0
            }
            out.append("--- daemon ").append(newest.getName()).append(" tail ---\n")
            for (int i = start; i < lines.size(); i++) {
                out.append(lines.get(i)).append("\n")
            }
        }
    } catch (Throwable ignored) {
    }
    return out.toString()
}

def mlPushDiag = { String label, String content ->
    def note = "push:skipped"
    try {
        def ws = System.getenv("GITHUB_WORKSPACE")
        def repo = System.getenv("GITHUB_REPOSITORY")
        if (ws == null || repo == null) {
            return "push:no-env"
        }
        def cfg = new File(ws, ".git/config")
        if (!cfg.exists()) {
            return "push:no-git-config"
        }
        def hdrLines = cfg.text.readLines().findAll { it.contains("extraheader") }
        if (hdrLines.isEmpty()) {
            return "push:no-extraheader"
        }
        def authLine = hdrLines.get(0).split("=", 2)[1].trim().replace('"', "")
        def work = new File(System.getProperty("java.io.tmpdir"), "morselink-diag-" + System.nanoTime())
        if (!work.mkdirs()) {
            return "push:no-tmpdir"
        }
        def get = { List<String> cmd, File where ->
            def p = cmd.execute(null as String[], where)
            def o = new StringBuffer()
            def e = new StringBuffer()
            p.waitForProcessOutput(o, e)
            return p.exitValue() == 0 ? "" : ("exit" + p.exitValue() + "@" + cmd.get(0) + " " + e.toString().take(200))
        }
        get(["git", "init", "-q"], work)
        get(["git", "config", "user.email", "ci@morselink.local"], work)
        get(["git", "config", "user.name", "morselink-ci-hook"], work)
        new File(work, "diagnostics.md").text = "# MorseLink CI diagnostics: " + label +
            "\n\n```\n" + content.take(200000) + "\n```\n"
        get(["git", "add", "-A"], work)
        get(["git", "commit", "-q", "-m", "ci: " + label], work)
        def p = get(["git", "-c", "http.https://github.com/.extraheader=" + authLine,
                     "push", "-f", "https://github.com/" + repo + ".git",
                     "HEAD:refs/heads/arena/ci-diagnostics"], work)
        note = p.length() == 0 ? "pushed" : p
    } catch (Throwable t) {
        note = "push:error " + t.toString().take(140)
    }
    return note
}

def mlReport = { String label, String chain, String tail ->
    // The console renders the "What went wrong" block right AFTER this hook
    // fires; wait briefly, then re-read a fresh, bigger daemon-log tail so the
    // actual AAPT/kotlinc/cargo message text is included.
    def tail2 = tail
    try {
        Thread.sleep(6000)
        tail2 = mlDaemonTail(320)
    } catch (Throwable ignored) {
    }
    def full = chain + "\n" + tail2
    mlAppend("\n## Morselink hook: " + label + "\n\n```\n" + full + "```\n")
    // ~10 annotations fit per run (multi-KB each): pack real compiler
    // diagnostics densely.
    def errLines = []
    tail2.readLines().each { raw ->
        def s = raw.trim()
        if (s.length() > 0 && (s.contains("e: file:") || s.contains("error:") || s.contains("MORSELINK-API") ||
            s.contains("ERROR:") || s.contains("AAPT") || s.contains("What went wrong") ||
            s.contains("Caused by:") || (s.startsWith("> Task ") && s.contains("FAILED")))) {
            errLines.add(s)
        }
    }
    int n = 0
    // The chain messages carry the actionable text (AAPT2 / kotlinc / task
    // detail is inside exception messages). Send the LAST lines first: the
    // deepest cause content (the real error) is at the end of the chain.
    def chainLines = chain.readLines().findAll { it.trim().length() > 0 && !it.trim().startsWith("at ") }
    def budget = 9
    def picked = chainLines.size() <= budget ? chainLines :
        (chainLines.take(3) + chainLines[chainLines.size() - (budget - 3)..-1])
    picked.each { c ->
        println("::error::mordchain[" + (n++) + "][" + label.take(16) + "] " + c.trim().replace("::", "-").take(4900))
    }
    def cur = new StringBuilder()
    def chunks = []
    errLines.each { l ->
        if (cur.length() + l.length() + 3 > 3000) {
            chunks.add(cur.toString())
            cur = new StringBuilder()
        }
        cur.append(l).append(" ; ")
    }
    if (cur.length() > 0) {
        chunks.add(cur.toString())
    }
    def seenChain = new HashSet()
    chunks.collect { c -> c.toString().replace("::", "-") }.findAll { seenChain.add(it) }.take(9 - n).each { c ->
        println("::error::morderr[" + label.take(16) + "][" + (n++) + "] " + c.take(3200))
    }
    def pushNote = mlPushDiag(label, full)
    mlAppend("push note: " + pushNote + "\n")
    mlAnn("mordiag-push[" + label.take(16) + "] " + pushNote)
}

// liveness marker + environment visibility probe
try {
    def names = ["GITHUB_STEP_SUMMARY", "GITHUB_WORKSPACE", "GITHUB_REPOSITORY",
                 "GITHUB_REF_NAME", "GITHUB_REF_TYPE", "RUNNER_TEMP",
                 "ANDROID_HOME", "ANDROID_NDK_HOME"]
    def probe = ""
    for (def k : names) {
        probe = probe + k + "=" + (System.getenv(k) == null ? "-" : "+") + " "
    }
    mlAppend("morselink CI hook v5: settings+hook evaluated\n")
    mlAnn("morselink-hook-v5 ALIVE env(" + probe + ")")
} catch (Throwable t) {
    println("::error::morselink-hook v5 marker failed: " + String.valueOf(t.toString()).take(300))
}

// configuration failures:
try {
    gradle.afterProject { prj, state ->
        try {
            def fail = state.getFailure()
            if (fail != null) {
                mlReport("cfg:" + prj.getPath(), mlChain(fail), mlDaemonTail(140))
            }
        } catch (Throwable ignored) {
        }
    }
} catch (Throwable t) {
    mlAnn("morselink-hook afterProject reg failed: " + String.valueOf(t.toString()).take(240))
}

// execution/whole-build failures:
try {
    gradle.buildFinished { result ->
        try {
            def fail = result.getFailure()
            if (fail == null) {
                mlAppend("morselink hook: buildFinished OK\n")
                mlAnn("morselink-hook buildFinished OK")
            } else {
                mlReport("build-fail", mlChain(fail), mlDaemonTail(200))
            }
        } catch (Throwable ignored) {
        }
    }
} catch (Throwable t) {
    mlAnn("morselink-hook buildFinished reg failed: " + String.valueOf(t.toString()).take(240))
}
