plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace = "com.morselink.coretransfer"
    compileSdk = 35

    defaultConfig {
        minSdk = 23
        targetSdk = 35
        ndk {
            // Required for legacy 32-bit Android 6.0 devices.
            abiFilters.addAll(["armeabi-v7a", "arm64-v8a", "x86_64"])
        }
    }
}

dependencies {
}

// ---------------------------------------------------------------------------
// Rust core build (shared engine). Consumes the SAME crate the desktop app uses,
// compiled to this device's ABIs. It produces:
//   - the shared library libmorselink_core.so (into src/main/jniLibs), and
//   - the UniFFI Kotlin bindings (package `morselink_core`) into a generated
//     source directory under build/generated/uniffi/<variant>.
//
// The UniFFI Kotlin bindings are added to the ANDROID source set matching the
// variant name (android.sourceSets["debug"/"release"].java.srcDir(...)). KGP's
// Android plugin mirrors those srcDirs into compile<Variant>Kotlin, so the .kt
// files land in this module's classes.jar and downstream modules resolve the
// `morselink_core` package. (Registering through AGP's variant.sources.java
// pipeline does NOT work: that only feeds javac, which ignores .kt files, and
// the bindings then never reach any compiler.) The srcDir registration is lazy,
// and the compile task explicitly dependsOn the generating task.
//
// AGP requires each variant's generated-source directory to be distinct, so we
// register a per-variant `buildRust<BuildType>` task. The underlying cargo build
// is cached, so the second variant's run is cheap.
//
// The bindgen CLI is `uniffi-bindgen`, built on the fly from the in-repo
// rust-core/bindgen crate (pinned to uniffi = 0.28.0). Skippable on dev boxes
// by exporting MORSELINK_SKIP_NATIVE=1.
// ---------------------------------------------------------------------------
abstract class RustBindgenTask extends DefaultTask {
    @Input
    abstract Property<String> getRustCoreDir()

    @Input
    abstract ListProperty<String> getAbis()

    // Destination of the generated UniFFI Kotlin bindings -> registered as a
    // generated Kotlin source dir via the Variant API. This is per-variant so
    // each variant gets its own distinct generated-source directory.
    @OutputDirectory
    abstract DirectoryProperty getBindingsDir()

    @TaskAction
    void generate() {
        def abiArgs = abis.get().collect { "-t $it" }.join(" ")
        // Destination of the compiled libmorselink_core.so. This is shared by
        // every variant and is deliberately NOT an @OutputDirectory on the task
        // (both buildRustDebug and buildRustRelease write here, and Gradle flags
        // the same output dir declared by two tasks). AGP picks the .so up from
        // src/main/jniLibs when it merges native libraries.
        def libsOut = new File(project.projectDir, "src/main/jniLibs").absolutePath
        def kotlinOut = bindingsDir.get().asFile.absolutePath

        // The workflow must pass ANDROID_NDK_HOME/ROOT; if the step-level env
        // expression resolved to a bogus path (it evaluates against the *job*
        // env), recover by deriving it from the SDK root the setup action
        // exported. cargo-ndk fails fast otherwise.
        def ndkExports = ""
        def ndkHome = System.getenv("ANDROID_NDK_HOME")
        if (!ndkHome || !new File(ndkHome).exists()) {
            def sdk = System.getenv("ANDROID_HOME")
            def cand = sdk ? new File(new File(sdk), "ndk/26.3.11579264") : null
            if (cand?.exists()) {
                ndkExports = "export ANDROID_NDK_HOME=\"${cand}\" ANDROID_NDK_ROOT=\"${cand}\" && "
            }
        }

        // `$` here are SHELL variables; escaped with a backslash so Groovy does
        // not interpolate them. The bindgen CLI is built from rust-core/bindgen.
        def cmd =
            "set -euo pipefail && " +
            ndkExports +
            "cargo ndk $abiArgs -o \"$libsOut\" build --release --features ffi --lib && " +
            // sort|awk keeps every byte consumed (no SIGPIPE under pipefail,
            // unlike `| head`), and works on both GNU and BSD find.
            "SO=\$(find \"$libsOut\" -name 'libmorselink_core.so' -type f | sort | awk 'NR==1{print}') && " +
            "TMP=\$(mktemp -d) && " +
            "cargo run --release --manifest-path bindgen/Cargo.toml -- " +
            "generate --library \"\$SO\" --language kotlin --out-dir \"\$TMP\" && " +
            "mkdir -p \"$kotlinOut\" && cp -r \"\$TMP/.\" \"$kotlinOut/\" && rm -rf \"\$TMP\""

        // Capture the FULL cargo/bindgen output to a file (the runner-side raw
        // log is not always reachable from tooling), and mirror the failure
        // tail into the Actions job summary before rethrowing.
        def logFile = new File(project.buildDir, "logs/morselink-rust-exec.log")
        logFile.parentFile.mkdirs()
        logFile.text = ""
        def os = new FileOutputStream(logFile)
        int exit
        try {
            // NOTE: inside a task class there is no implicit `file()` (that is
            // a Project method) — resolve through project.file(...).
            def res = project.exec {
                workingDir = project.file(rustCoreDir.get())
                commandLine("bash", "-lc", cmd)
                standardOutput = os
                errorOutput = os
                ignoreExitValue = true
            }
            exit = res.exitValue
        } finally {
            os.close()
        }
        if (exit != 0) {
            def tail = logFile.readLines().reverse().take(80).reverse().join("\n")
            def summary = System.getenv("GITHUB_STEP_SUMMARY")
            if (summary) {
                new File(summary) << "\n## :factory: Rust core / UniFFI task failed (exit $exit)\n\n" +
                    "Full log: `core-transfer/build/logs/morselink-rust-exec.log`\n\n```\n" +
                    tail.take(18000) + "\n```\n"
            }
            throw new GradleException(
                "cargo ndk / uniffi-bindgen failed with exit $exit; tail of captured output:\n$tail")
        }
    }
}

def rustCoreDirPath = rootProject.file("../rust-core").absolutePath
def abiList = ["armeabi-v7a", "arm64-v8a", "x86_64"]

// Accumulated per-variant buildRust providers, used to keep the .so merge tasks
// ordering-correct (see tasks.configureEach below).
def buildRustTasks = []

androidComponents {
    onVariants(selector().all()) { variant ->
        def taskName = "buildRust${variant.name.capitalize()}"
        def buildRust = tasks.register(taskName, RustBindgenTask) {
            description = "Compile the shared Rust core with cargo-ndk and generate UniFFI bindings"
            group = "build"

            rustCoreDir.set(rustCoreDirPath)
            abis.set(abiList)
            bindingsDir.set(layout.buildDirectory.dir("generated/uniffi/${variant.name}"))

            onlyIf { System.getenv("MORSELINK_SKIP_NATIVE") == null }
        }

        // Register the generated UniFFI Kotlin bindings as a real source root
        // for THIS variant. Key detail: the Kotlin Android plugin (KGP 1.9)
        // compiles the union of the *android source set* java srcDirs for each
        // variant — it does NOT pull in directories registered through AGP's
        // variant.sources.java pipeline (that one only feeds javac, which
        // ignores *.kt). So we add the generated dir to the android source set
        // named after the build type ("debug"/"release"); KGP mirrors those
        // into the matching compile<Variant>Kotlin task, the .kt files are
        // compiled into this module's classes.jar, and downstream modules (:app)
        // can resolve the `morselink_core` package. The srcDir is lazy, so the
        // files only having to exist at execution time is fine.
        android.sourceSets.getByName(variant.name).java.srcDir(
            layout.buildDirectory.dir("generated/uniffi/${variant.name}"))

        // Make this variant's Kotlin compile depend on the generating task so
        // the sources exist when the compiler snapshots its inputs.
        tasks.matching { it.name == "compile${variant.name.capitalize()}Kotlin" }
             .configureEach { dependsOn(buildRust) }

        buildRustTasks += buildRust
    }
}

// The generated .so lives in src/main/jniLibs; AGP packages it when the library
// merge tasks run. Ensure buildRust has run before those tasks so libmorselink
// _core.so is present. Using configureEach avoids the "task not found" crash
// from tasks.named(...) on a com.android.library module in AGP 8.x.
tasks.configureEach {
    if (name == "preBuild" ||
        (name.startsWith("merge") && (name.contains("JniLibFolders") || name.contains("NativeLibs")))) {
        dependsOn(buildRustTasks)
    }
}
