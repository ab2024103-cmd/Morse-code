plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace = "com.morselink.coretransfer"
    compileSdk = 35

    defaultConfig {
        minSdk = 23
        targetSdk = 35
        ndk {
            // Required for legacy 32-bit Android 6.0 devices.
            abiFilters.addAll(["armeabi-v7a", "arm64-v8a", "x86_64"])
        }
    }

    sourceSets.main.java.srcDirs("src/main/java/kotlin")
}

dependencies {
}

// ---------------------------------------------------------------------------
// Rust core build (shared engine). Consumes the SAME crate the desktop app uses,
// compiled to this device's ABIs and producing the UniFFI Kotlin bindings at
// src/main/java/kotlin. The `uniffi-bindgen` CLI is built on the fly from the
// in-repo rust-core/bindgen crate (pinned to uniffi = 0.28.0). Skippable on dev
// boxes by exporting MORSELINK_SKIP_NATIVE=1.
//
// We wire buildRust in LAZILY (tasks.configureEach) rather than calling
// tasks.named("mergeDebugJniLibFolders"), because that task does not exist on a
// `com.android.library` module in AGP 8.x — referencing it by name crashes the
// build at configuration time.
// ---------------------------------------------------------------------------
def rustCoreDir = rootProject.file("../rust-core")
def jniLibsDir = file("src/main/jniLibs")
def genKotlinDir = file("src/main/java/kotlin")
def abis = ["armeabi-v7a", "arm64-v8a", "x86_64"]

def buildRust = tasks.register("buildRust", Exec) {
    description = "Compile the shared Rust core with cargo-ndk and generate UniFFI bindings"
    group = "build"
    workingDir = rustCoreDir

    onlyIf { System.getenv("MORSELINK_SKIP_NATIVE") == null }

    def abiArgs = abis.collect { "-t $it" }.join(" ")
    def libsOut = jniLibsDir.absolutePath
    def kotlinOut = genKotlinDir.absolutePath

    // "$" here are SHELL variables; they are escaped with a backslash so Groovy
    // does not interpolate them. The bindgen CLI is built from rust-core/bindgen.
    commandLine("bash", "-lc",
        "set -euo pipefail && " +
        "cargo ndk $abiArgs -o \"$libsOut\" build --release --features ffi --lib && " +
        "SO=\$(find \"$libsOut\" -name 'libmorselink_core.so' | head -n1) && " +
        "TMP=\$(mktemp -d) && " +
        "cargo run --release --manifest-path bindgen/Cargo.toml -- " +
        "generate --library \"\$SO\" --language kotlin --out-dir \"\$TMP\" && " +
        "mkdir -p \"$kotlinOut\" && cp -r \"\$TMP/.\" \"$kotlinOut/\" && rm -rf \"\$TMP\"")
}

// Lazy wiring: ensure buildRust runs before any task that needs the .so in
// src/main/jniLibs (preBuild and every JNI-lib merge/packaging task). Using
// configureEach avoids the "task not found" crash from tasks.named(...).
tasks.configureEach {
    if (name == "preBuild" ||
        (name.startsWith("merge") && name.contains("JniLibFolders")) ||
        (name.startsWith("merge") && name.contains("NativeLibs"))) {
        dependsOn(buildRust)
    }
}
