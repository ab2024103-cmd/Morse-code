plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace = "com.morselink.coretransfer"
    compileSdk = 35

    defaultConfig {
        minSdk = 23
        targetSdk = 35
        ndk {
            // Required for legacy 32-bit Android 6.0 devices.
            abiFilters.addAll(["armeabi-v7a", "arm64-v8a", "x86_64"])
        }
    }

    sourceSets {
        main {
            // Register the generated UniFFI Kotlin bindings directory in the
            // KOTLIN source root, not only the java one. core-transfer has no
            // committed *.kt files (unlike the feature modules, whose .kt live
            // under the default src/main/java root and are picked up by
            // recursion), so its Kotlin compile source set stays empty and
            // compile*Kotlin reports NO-SOURCE even after buildRust populates
            // the folder. Adding it to `kotlin.srcDir(...)` makes it a real
            // Kotlin source root.
            java.srcDirs("src/main/java/kotlin")
            kotlin.srcDir("src/main/java/kotlin")
        }
    }
}

// Create the generated-source directory at CONFIGURATION time, not just when
// buildRust runs. AGP registers Kotlin source roots when the configuration is
// evaluated; if this directory only appears at execution time (created by
// buildRust's `mkdir -p`/`cp`), compile*Kotlin snapshots an empty source set and
// reports NO-SOURCE, so the generated morselink_core bindings are never compiled
// and the app cannot resolve them. Making the directory exist up front turns it
// into a real source root; AGP re-walks registered source dirs at execution, so
// the bindings copied in by buildRust (which compile*Kotlin depends on) are
// picked up.
file("src/main/java/kotlin").mkdirs()

dependencies {
}

// ---------------------------------------------------------------------------
// Rust core build (shared engine). Consumes the SAME crate the desktop app uses,
// compiled to this device's ABIs and producing the UniFFI Kotlin bindings at
// src/main/java/kotlin. The `uniffi-bindgen` CLI is built on the fly from the
// in-repo rust-core/bindgen crate (pinned to uniffi = 0.28.0). Skippable on dev
// boxes by exporting MORSELINK_SKIP_NATIVE=1.
//
// We wire buildRust in LAZILY (tasks.configureEach) rather than calling
// tasks.named("mergeDebugJniLibFolders"), because that task does not exist on a
// `com.android.library` module in AGP 8.x — referencing it by name crashes the
// build at configuration time.
// ---------------------------------------------------------------------------
def rustCoreDir = rootProject.file("../rust-core")
def jniLibsDir = file("src/main/jniLibs")
def genKotlinDir = file("src/main/java/kotlin")
def abis = ["armeabi-v7a", "arm64-v8a", "x86_64"]

def buildRust = tasks.register("buildRust", Exec) {
    description = "Compile the shared Rust core with cargo-ndk and generate UniFFI bindings"
    group = "build"
    workingDir = rustCoreDir

    onlyIf { System.getenv("MORSELINK_SKIP_NATIVE") == null }

    def abiArgs = abis.collect { "-t $it" }.join(" ")
    def libsOut = jniLibsDir.absolutePath
    def kotlinOut = genKotlinDir.absolutePath

    // "$" here are SHELL variables; they are escaped with a backslash so Groovy
    // does not interpolate them. The bindgen CLI is built from rust-core/bindgen.
    commandLine("bash", "-lc",
        "set -euo pipefail && " +
        "cargo ndk $abiArgs -o \"$libsOut\" build --release --features ffi --lib && " +
        "SO=\$(find \"$libsOut\" -name 'libmorselink_core.so' | head -n1) && " +
        "TMP=\$(mktemp -d) && " +
        "cargo run --release --manifest-path bindgen/Cargo.toml -- " +
        "generate --library \"\$SO\" --language kotlin --out-dir \"\$TMP\" && " +
        "mkdir -p \"$kotlinOut\" && cp -r \"\$TMP/.\" \"$kotlinOut/\" && rm -rf \"\$TMP\"")
}

// Lazy wiring: ensure buildRust runs before any task that needs its outputs —
// the .so in src/main/jniLibs AND the generated UniFFI Kotlin bindings in
// src/main/java/kotlin. The latter are compiled by compile*Kotlin, so those
// tasks must run after buildRust too; otherwise compileDebugKotlin snapshots an
// empty source dir (NO-SOURCE) and the app never sees the morselink_core
// package. Using configureEach avoids the "task not found" crash from
// tasks.named(...).
tasks.configureEach {
    if (name == "preBuild" ||
        name.startsWith("compile") ||
        (name.startsWith("merge") && name.contains("JniLibFolders")) ||
        (name.startsWith("merge") && name.contains("NativeLibs"))) {
        dependsOn(buildRust)
    }
}
