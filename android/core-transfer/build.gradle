plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace = "com.morselink.coretransfer"
    compileSdk = 35

    defaultConfig {
        minSdk = 23
        targetSdk = 35
        ndk {
            // Required for legacy 32-bit Android 6.0 devices.
            abiFilters.addAll(["armeabi-v7a", "arm64-v8a", "x86_64"])
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    // UniFFI's Kotlin bindings are JNA-based (com.sun.jna.* in every
    // generated file), and consumers must see it too: :app instantiates
    // TransferEngine, whose supertype FFIObject exposes a com.sun.jna.Pointer
    // member — Kotlin requires supertypes on the consumer's compile
    // classpath, hence `api` and not `implementation`. The @aar flavor ships
    // libjnidispatch for Android devices.
    api("net.java.dev.jna:jna:5.13.0@aar")
    // The generated UniFFI file is annotated with @androidx.annotation.RequiresApi
    // (System.loadLibrary gating). It's not pulled in transitively by the JNA
    // @aar (non-transitive notation), so declare it — `api` because the
    // annotation is on the public API surface that :app compiles against.
    api("androidx.annotation:annotation:1.8.2")
}

// ---------------------------------------------------------------------------
// Rust core build (shared engine). Consumes the SAME crate the desktop app uses,
// compiled to this device's ABIs. It produces:
//   - the shared library libmorselink_core.so (into src/main/jniLibs), and
//   - the UniFFI Kotlin bindings (package `morselink_core`) into a generated
//     source directory under build/generated/uniffi/main.
//
// The bindings are added to the main android source set (java.srcDir inside
// android{}, at configuration time). KGP's Android integration compiles *.kt
// files found in java srcDirs, so the bindings land in this module's
// classes.jar and every consumer module resolves `morselink_core` through the
// normal project dependency. A single shared task/directory serves all
// variants: the bindings are variant-independent, and one generating task
// avoids two tasks declaring the same @OutputDirectory. (Registering through
// AGP's variant.sources.java pipeline does NOT work: that only feeds javac,
// which ignores .kt files. And doing it from androidComponents.onVariants is
// too late for KGP's source-set sync.)
//
// The bindgen CLI is `uniffi-bindgen`, built on the fly from the in-repo
// rust-core/bindgen crate (pinned to uniffi = 0.28.0). Skippable on dev boxes
// by exporting MORSELINK_SKIP_NATIVE=1.
// ---------------------------------------------------------------------------
abstract class RustBindgenTask extends DefaultTask {
    @Input
    abstract Property<String> getRustCoreDir()

    @Input
    abstract ListProperty<String> getAbis()

    // Destination of the generated UniFFI Kotlin bindings -> registered on the
    // main android source set (see android.sourceSets below).
    @OutputDirectory
    abstract DirectoryProperty getBindingsDir()

    @TaskAction
    void generate() {
        // Values are handed to the shell script THROUGH THE ENVIRONMENT, and
        // the script body is a Groovy triple-quoted SINGLE string (no Groovy
        // interpolation, no \$ escape games). Earlier double-quoted variants
        // produced subtly wrong shell quoting, which made uniffi-bindgen
        // "silently" write its output into a bogus directory.
        def rustCore = new File(rustCoreDir.get()).absolutePath
        def libsOut = new File(project.projectDir, "src/main/jniLibs").absolutePath
        def kotlinOut = bindingsDir.get().asFile.absolutePath

        def env = [:] as Map<String, String>
        def ndkHome = System.getenv("ANDROID_NDK_HOME")
        if (!ndkHome || !new File(ndkHome).exists()) {
            def sdk = System.getenv("ANDROID_HOME")
            def cand = sdk ? new File(new File(sdk), "ndk/26.3.11579264") : null
            if (cand?.exists()) {
                ndkHome = cand.absolutePath
            }
        }
        if (ndkHome) {
            env["ANDROID_NDK_HOME"] = ndkHome
            env["ANDROID_NDK_ROOT"] = ndkHome
        }
        env["MORSELINK_RUSTCORE"] = rustCore
        env["MORSELINK_LIBSOUT"] = libsOut
        env["MORSELINK_KOTLINOUT"] = kotlinOut
        env["MORSELINK_ABIS"] = abis.get().join(",")

        def scriptFile = new File(project.buildDir, "logs/morselink-rust-build.sh")
        scriptFile.parentFile.mkdirs()
        scriptFile.text = '''#!/usr/bin/env bash
# Generated by :core-transfer buildRust (see core-transfer/build.gradle).
set -euo pipefail
echo "MORSELINK-RUST-SCRIPT-BEGIN (cwd: $(pwd))"
abiArgs=""
IFS=',' read -ra A <<< "${MORSELINK_ABIS}"
for a in "${A[@]}"; do abiArgs="$abiArgs -t $a"; done

echo "== [1/6] cargo ndk: android ABIs -> jniLibs"
cargo ndk $abiArgs -o "${MORSELINK_LIBSOUT}" build --release --features ffi --lib

echo "== [2/6] host cdylib (carrier of the uniffi metadata)"
# DEBUG profile on purpose: [profile.release] lto="thin" has been observed to
# drop/merge away the custom .uniffi metadata section that print-repr/generate
# read statically from the cdylib. Dev profile = plain object sections.
cargo build --features ffi --lib
HOSTLIB="${MORSELINK_RUSTCORE}/target/debug/libmorselink_core.so"
test -f "$HOSTLIB" || { echo "FATAL: no host cdylib at $HOSTLIB" >&2; exit 5; }

echo "== [3/6] bindgen CLI"
cargo build --release --manifest-path "${MORSELINK_RUSTCORE}/bindgen/Cargo.toml"
BIND="${MORSELINK_RUSTCORE}/bindgen/target/release/uniffi-bindgen"
test -x "$BIND" || BIND="${MORSELINK_RUSTCORE}/target/release/uniffi-bindgen"
test -x "$BIND" || { echo "FATAL: uniffi-bindgen binary not found" >&2; exit 6; }

echo "== [4/6] print-repr metadata probe"
if ! "$BIND" print-repr "$HOSTLIB" > /tmp/morselink-repr.txt 2>&1; then
  echo "FATAL: print-repr failed - the host cdylib carries no uniffi metadata:" >&2
  head -c 1200 /tmp/morselink-repr.txt >&2
  exit 7
fi
echo "repr lines: $(wc -l < /tmp/morselink-repr.txt); head:"
head -c 600 /tmp/morselink-repr.txt

echo "== [5/6] generate kotlin bindings"
TMP=$(mktemp -d)
"$BIND" generate --library "$HOSTLIB" --config "${MORSELINK_RUSTCORE}/uniffi.toml" --language kotlin --out-dir "$TMP" --no-format
echo GEN-FILES:
find "$TMP" -type f | sort
mkdir -p "${MORSELINK_KOTLINOUT}"
find "$TMP" -name '*.kt' -type f -print0 | xargs -0 -r cp -t "${MORSELINK_KOTLINOUT}/"

echo "== [6/6] bindings sanity"
KT=$(find "${MORSELINK_KOTLINOUT}" -name '*.kt' -type f | sort | awk 'NR==1{print}')
if test -z "$KT"; then
  echo "FATAL: no .kt files copied; repr was:" >&2
  head -c 600 /tmp/morselink-repr.txt >&2
  exit 3
fi
grep -q "^package morselink_core$" "$KT" || { echo "FATAL: wrong package; head of $KT:" >&2; head -20 "$KT" >&2; exit 4; }
echo "bindings OK: $(find "${MORSELINK_KOTLINOUT}" -name '*.kt' | wc -l) .kt file(s), first=$KT"
'''

        def logFile = new File(project.buildDir, "logs/morselink-rust-exec.log")
        logFile.text = ""
        def os = new FileOutputStream(logFile)
        int exit
        try {
            def res = project.exec {
                workingDir = project.file(rustCoreDir.get())
                commandLine("bash", scriptFile.absolutePath)
                environment env
                standardOutput = os
                errorOutput = os
                ignoreExitValue = true
            }
            exit = res.exitValue
        } finally {
            os.close()
        }
        if (exit == 0) {
            // Echo the real shape of the generated API surface to the gradle
            // console: the CI hook relays marked lines as annotations, which is
            // our only runner->sandbox channel. Settles name-mismatch questions
            // (e.g. how the uniffi::Error enum surfaces in Kotlin) in one run.
            try {
                def names = []
                new File(kotlinOut).eachFileRecurse { f ->
                    if (f.name.endsWith(".kt")) {
                        f.eachLine { l ->
                            def m = (l =~ /^(?:public |internal |open |sealed |data |value )*class (\w+)|^(?:public )?interface (\w+)/)
                            if (m.find()) {
                                def nm = m.group(1) ?: m.group(2)
                                if (nm && !names.contains(nm)) {
                                    names.add(nm)
                                }
                            }
                        }
                    }
                }
                def line = "MORSELINK-API classes: " + names.join(", ")
                println(line)
                def summary = System.getenv("GITHUB_STEP_SUMMARY")
                if (summary) {
                    new File(summary) << "\n" + line + "\n"
                }
            } catch (Throwable t) {
                println("MORSELINK-API scan failed: " + t)
            }
        }
        if (exit != 0) {
            // Keep the throw-message small: the *last* lines are the ones with
            // the real error (cargo noise dominates the beginning). Gradle
            // truncates very long exception messages in failure reports.
            def tail = logFile.readLines().reverse().take(30).reverse().join("\\n")
            def summary = System.getenv("GITHUB_STEP_SUMMARY")
            if (summary) {
                new File(summary) << "\\n## :factory: Rust core / UniFFI task failed (exit $exit)\\n\\n" +
                    "Full log: `core-transfer/build/logs/morselink-rust-exec.log`\\n\\n```\\n" +
                    tail.take(18000) + "\\n```\\n"
            }
            throw new GradleException(
                "cargo ndk / uniffi-bindgen failed with exit $exit; tail of captured output:\\n$tail")
        }
    }
}

def rustCoreDirPath = rootProject.file("../rust-core").absolutePath
def abiList = ["armeabi-v7a", "arm64-v8a", "x86_64"]

def buildRust = tasks.register("buildRust", RustBindgenTask) {
    description = "Compile the shared Rust core with cargo-ndk and generate UniFFI bindings"
    group = "build"
    rustCoreDir.set(rustCoreDirPath)
    abis.set(abiList)
    bindingsDir.set(layout.buildDirectory.dir("generated/uniffi/main"))
    onlyIf { System.getenv("MORSELINK_SKIP_NATIVE") == null }
}

// Everything that could consume generated sources or the packaged .so must run
// after buildRust. Matching by name (not registering on specific tasks) keeps
// this immune to KGP/AGP task-creation ordering; a Provider defers resolution
// of the dependency until execution planning.
tasks.configureEach { t ->
    def n = t.name
    if (n.startsWith("compile") && n.endsWith("Kotlin") ||
        n == "preBuild" ||
        (n.startsWith("merge") && (n.contains("JniLibFolders") || n.contains("NativeLibs")))) {
        t.dependsOn(buildRust)
    }
}

// Make the generated UniFFI Kotlin bindings part of THIS library's compiled
// output (classes.jar) so every consumer module (the :app and feature
// modules) resolves the `morselink_core` package through the normal project
// dependency. This registration lives inside android{} — configuration time,
// strictly before KGP's afterEvaluate source-set sync (the androidComponents
// onVariants callback we used before runs too late for that, which is why
// morselink_core stayed unresolved). Files appearing at execution time are
// fine: KotlinCompile snapshots sources when it runs, and the dependsOn above
// orders buildRust ahead of it. The repo-wide convention of compiling *.kt
// from java srcDirs is what this rides on (documented in gradle docs: KGP's
// Android integration adds the java srcDirs to the Kotlin source sets).
android.sourceSets.getByName("main").java.srcDir(
    layout.buildDirectory.dir("generated/uniffi/main"))
