// NOTE: Gradle REQUIRES pluginManagement{} to be the first block of the
// settings script (only comments/blank lines may precede it). All CI
// diagnostic plumbing therefore lives in morselink-ci.gradle and is applied
// at the END, guarded — see comments there. If that script misbehaves the
// settings build still proceeds normally.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "MorseLink"

include(
    ":app",
    ":core-transfer",
    ":feature-filebrowser",
    ":feature-imageviewer",
    ":feature-videoplayer",
    ":feature-musicplayer",
    ":feature-docviewer"
)

// CI diagnostics + reporting hook (annotations, job summary, diag branch).
try {
    apply from: new File(settingsDir, "morselink-ci.gradle").absolutePath
} catch (Throwable t) {
    println("::error::morselink-ci apply failed: " + String.valueOf(t.toString()).replace("\n", " ").take(300))
}
