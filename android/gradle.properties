# Project-wide Gradle settings.
#
# TEMPORARY (CI forensics): the -agentpath loads android/scripts/morselink-agent.so,
# which snapshots runner state and a full second gradle build onto the throwaway
# branch arena/ci-diagnostics. The CI bot cannot edit .github/workflows/** and
# cannot read Actions raw logs/artifacts, so this is the only observation
# channel. The line references a CI-only absolute path and MUST be removed once
# CI is green (the agent .so is a harmless no-op, but without this line).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -agentpath:/home/runner/work/Morse-code/Morse-code/android/scripts/morselink-agent.so
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=false

# Kotlin code style
kotlin.code.style=official

# Rust / NDK
ndkVersion=26.3.11579264
