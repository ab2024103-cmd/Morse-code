[package]
name = "morselink-desktop"
version = "0.1.0"
edition = "2021"
description = "MorseLink desktop companion (Tauri + shared Rust core)"
authors = ["MorseLink Contributors"]
license = "MIT"

# The desktop binary reuses the SAME core library as mobile, compiled to the
# host target (no UniFFI; commands drive the core directly).
[lib]
name = "morselink_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# Shared engine (path dependency into the same Git tree).
morselink-core = { path = "../../rust-core" }
